<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SatSky">
  <meta name="theme-color" content="#070b14">
  <title>SatSky</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-180.png" width="30" height="30" alt="">
      <div>
        <h1>SatSky</h1>
        <p class="tag">What’s above you right now</p>
      </div>
    </div>
    <div class="meta">
      <span id="source-badge" class="badge offline">—</span>
      <span id="loc" class="pill">📍 …</span>
      <span id="clock" class="pill">—</span>
    </div>
    <div id="status" class="status">Starting…</div>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="Search name or NORAD…" autocomplete="off">
      <div class="row">
        <select id="type-filter">
          <option value="all">All types</option>
          <option value="Space Station">Space Stations</option>
          <option value="Science">Science</option>
          <option value="Weather">Weather</option>
          <option value="Earth Observation">Earth Obs</option>
          <option value="Navigation">Navigation</option>
          <option value="Communications">Comms</option>
          <option value="Starlink">Starlink</option>
          <option value="Bright">Bright</option>
          <option value="Amateur">Amateur</option>
        </select>
        <label class="el-label">Min El <span id="el-val">5°</span>
          <input id="el-filter" type="range" min="0" max="30" value="5">
        </label>
      </div>
    </section>

    <section>
      <div class="sec-head">Sky <span class="count" id="vis-count">0</span> / <span id="total-count">0</span></div>
      <div class="sky-wrap"><canvas id="sky" width="320" height="320"></canvas></div>
    </section>

    <section>
      <div class="sec-head">Next rising passes (stations & Hubble)</div>
      <div id="passes" class="passes"></div>
    </section>

    <section>
      <div class="sec-head">Currently visible</div>
      <div id="list" class="list"><div class="empty">Loading…</div></div>
    </section>
  </main>

  <footer>
    <button id="btn-refresh" class="ghost">Refresh position</button>
    <button id="btn-live">Try live data</button>
  </footer>

  <script src="satellite.min.js"></script>
  <script src="satellites.js"></script>
  <script src="app.js"></script>
</body>
</html>
